[project]
name = "comptest"
version = "0.1.0"
authors = [
    { name = "Jeppe Klitgaard", email = "s250250@dtu.dk" },
]
requires-python = ">=3.14"
dependencies = []

[tool.pixi.activation.env]
JUST_JUSTFILE = "$PIXI_PROJECT_ROOT/justfile"

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.anaconda.org/dnachun"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
comptest = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
polars = ">=1.42.1,<2"
psutil = ">=7.2.2,<8"

# Compression binaries
imagemagick = ">=7.1.2_27,<8"
libtiff = ">=4.7.2,<5"
lzip = ">=1.21,<2"
plzip = { version = ">=1.11,<2", channel = "dnachun" }

# Development tools - not in separate group because this is not a library project
ipykernel = "<7"
ruff = ">=0.15.21,<0.16"