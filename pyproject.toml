[project]
name = "comptest"
version = "0.1.0"
authors = [{ name = "Jeppe Klitgaard", email = "s250250@dtu.dk" }]
requires-python = ">=3.13"
dependencies = [
    "qim3d @ git+https://github.com/qim-center/qim3d@jk/fixes-for-compression-study",
    "ipykernel<7",
    "scientific-pydantic",
    "memory-tempfile>=2.2.3,<3",
    "sewar>=0.4.8,<0.5",
    "pyiqa>=0.1.16,<0.2",
    "jax>=0.11.0",
    "pillow-jxl-plugin>=1.3.8,<2",
    "pydicom[pixeldata]>=3.0.2,<4",
]

[project.scripts]
comptest = "comptest.cli.__main__:app"

[tool.pixi.activation.env]
JUST_JUSTFILE = "$PIXI_PROJECT_ROOT/justfile"

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.anaconda.org/dnachun", "ccpi"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
comptest = { path = ".", editable = true }
picax = { path = "picax", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
# Data
dask = ">=2026.7.1,<2027"
dask-jobqueue = ">=0.9.0,<0.10"
einops = ">=0.8.2,<0.9"
numpy = ">=2,<3"
polars = ">=1.42.1,<2"
pyarrow = ">=25.0.0,<26"
scikit-image = ">=0.26.0,<0.27"

# Viz
adjusttext = ">=1.4.0,<2"   # For plotnine label adjustment
matplotlib = ">=3.11.0,<4"
napari = ">=0.9.0,<0.10"
plotnine = ">=0.15.7,<0.16"
seaborn = ">=0.13.2,<0.14"

# CLI Binaries
imagemagick = ">=7.1.2_27,<8"
libjxl = ">=0.12.0,<0.13"
libjxl-tools = ">=0.12.0,<0.13"
libtiff = ">=4.7.2,<5"
exiftool = ">=13.59,<14"

# Images
tifffile = ">=2026.7.14,<2027"
pillow = ">=12.3.0,<13"

# Development tools - not in separate group because this is not a library project
# ipykernel = "<7"
ruff = ">=0.15.21,<0.16"

# Zarr
imagecodecs = ">=2026.6.26,<2027"
ome-zarr = ">=0.18.0,<0.19"
pydantic-zarr = ">=0.10.0,<0.11"
zarr = ">=3.2.1,<4"
zfpy = ">=1.0.1,<2"

# Reconstruction
cil = ">=26.0.0,<27"
tigre = ">=3.1.3,<4"

# Misc
cloudpickle = ">=3.1.2,<4"
joblib = ">=1.5.3,<2"
psutil = ">=7.2.2,<8"
sentinel = ">=1.0.0,<2"
typer = ">=0.27.0,<0.28"
papermill = ">=2.7.0,<3"
bidict = ">=0.23.1,<0.24"
nibabel = ">=5.4.2,<6"

[tool.pixi.target.linux-64.dependencies]
# These are only available on Linux
lzip = ">=1.21,<2"
plzip = { version = ">=1.11,<2", channel = "dnachun" }

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
